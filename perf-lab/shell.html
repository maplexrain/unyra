<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>页签切换性能实验台 · 最小化链路复刻</title>
<style>
  /* 这套配色照抄应用的纸墨主题，看数字的时候眼睛不用换档 */
  :root {
    --paper: #f6f2ea;
    --card: #fffdf9;
    --line: #e2dacb;
    --line-strong: #cfc4ae;
    --ink: #33302b;
    --ink-soft: #6b6559;
    --ink-faint: #9a9285;
    --seal: #a8432f;
    --seal-deep: #8c3524;
    --warn: #b4791f;
    --bad: #a8322a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 13px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .lab { display: grid; grid-template-columns: 320px 1fr 300px; height: 100vh; }
  .panel, .metrics { overflow-y: auto; background: var(--card); padding: 14px 14px 32px; }
  .panel { border-right: 1px solid var(--line); }
  .metrics { border-left: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0 0 6px; letter-spacing: .02em; }
  h2 { font-size: 13px; margin: 0 0 10px; }
  h3 { font-size: 12px; margin: 16px 0 6px; color: var(--ink-soft); }
  .muted { color: var(--ink-faint); }
  .small { font-size: 11px; line-height: 1.6; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 12px 0; padding: 10px 10px 12px; }
  legend { font-size: 11px; color: var(--ink-soft); padding: 0 4px; }
  label { display: block; font-size: 12px; margin: 8px 0; }
  label b { color: var(--seal-deep); font-weight: 600; }
  input[type=range] { width: 100%; margin-top: 3px; accent-color: var(--seal); }
  label.check { display: flex; align-items: center; gap: 7px; margin: 7px 0; cursor: pointer; }
  label.check input { accent-color: var(--seal); }
  button {
    display: block; width: 100%; margin: 6px 0; padding: 7px 10px; font-size: 12px;
    border: 1px solid var(--line-strong); border-radius: 7px;
    background: var(--paper); color: var(--ink); cursor: pointer;
  }
  button:hover { border-color: var(--seal); color: var(--seal-deep); }
  button.ghost { background: transparent; border-style: dashed; }

  /* ---- 被测工作区 ---- */
  .work { display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px;
    border-bottom: 1px solid var(--line); background: linear-gradient(to bottom, var(--card), var(--paper));
    flex: 0 0 auto;
  }
  .bullseye { color: var(--seal); }
  .goal { font-weight: 600; font-size: 12.5px; }
  .breadcrumb {
    display: flex; gap: 5px; align-items: center; font-size: 11px; color: var(--ink-faint);
    overflow-x: auto; white-space: nowrap; max-width: 34vw; flex: 0 1 auto;
  }
  .breadcrumb .now { color: var(--ink); font-weight: 600; }
  .beat { margin-left: auto; font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .split { display: grid; grid-template-columns: 240px 1fr 300px; flex: 1 1 auto; min-height: 0; }
  .sidebar { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .sidebarhead { padding: 8px 10px; font-size: 11px; color: var(--ink-soft); border-bottom: 1px solid var(--line); }
  .tree { flex: 1 1 auto; overflow-y: auto; padding: 4px 0; }
  .row { display: flex; align-items: center; gap: 6px; padding: 3px 10px; font-size: 11.5px; cursor: pointer; }
  .row:hover { background: rgba(168, 67, 47, .06); }
  .row.active { background: rgba(168, 67, 47, .1); font-weight: 600; }
  .row .dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; background: var(--line-strong); }
  .row .dot.s-mastered { background: var(--seal); }
  .row .dot.s-learning { background: var(--warn); }
  .row .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .trail { display: none; }

  .docpane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .tabs {
    display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line);
    overflow-x: auto; flex: 0 0 auto;
  }
  .tab { padding: 5px 10px; font-size: 11.5px; border: 1px solid transparent; border-radius: 7px 7px 0 0; cursor: pointer; max-width: 150px; }
  .tab:hover { background: rgba(0,0,0,.03); }
  .tab.active { background: var(--paper); border-color: var(--line); border-bottom-color: transparent; font-weight: 600; }
  .tab .tabtitle { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc { padding: 14px 18px; overflow-y: auto; flex: 1 1 auto; min-height: 0; }
  .doc h3 { font-size: 15px; margin: 0 0 6px; color: var(--ink); }
  .doc .body { white-space: pre-wrap; word-break: break-all; font-size: 12px; color: var(--ink-soft); }

  .agent { border-left: 1px solid var(--line); overflow-y: auto; padding: 10px; min-height: 0; }
  .msg { margin-bottom: 10px; }
  .msg .who { font-size: 11px; color: var(--seal-deep); font-weight: 600; }
  .msg .text { font-size: 11.5px; color: var(--ink-soft); }
  .msg .meta { font-size: 10px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  /* ---- 指标 ---- */
  .kv { padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .kv span { display: block; font-size: 11px; color: var(--ink-soft); }
  .kv b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
  .kv em { display: block; font-size: 10.5px; font-style: normal; }
  table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  td { padding: 4px 0; border-bottom: 1px solid var(--line); }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="root"></div>
<script>/*BUNDLE*/</script>
</body>
</html>
